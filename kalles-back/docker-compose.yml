services:
  db:
    image: postgres:17.7-alpine
    container_name: kalles_db
    restart: always
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: kalles_admin
      POSTGRES_PASSWORD: kalles_password
      POSTGRES_DB: kalles
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalles_admin -d kalles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kalles_pgadmin
    restart: always
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kalles.com
      PGADMIN_DEFAULT_PASSWORD: admin