# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate create the schema for tests and drop it afterwards to avoid validation errors
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway in tests (H2 does not support PostgreSQL-specific SQL)
spring.flyway.enabled=false

# Logging to warn less in tests
logging.level.org.hibernate=ERROR

security.encryption.tenant-credentials-secret=test-tenant-credentials-secret

