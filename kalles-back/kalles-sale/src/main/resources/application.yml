spring:
  profiles:
    active: local # Ativa o application-local.yml

  application:
    name: kalles-sale

  datasource:
    url: jdbc:postgresql://localhost:5432/kalles
    username: kalles_admin
    password: kalles_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    detect-encoding: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: kallessoftware@gmail.com
    password: wwpaoevckqbnvwsw
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  encryption:
    tenant-credentials-secret: ${TENANT_CREDENTIALS_SECRET}

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:}
    default-plan-code: monthly-default
