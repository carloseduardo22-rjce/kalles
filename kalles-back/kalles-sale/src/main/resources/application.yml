spring:
  application:
    name: kalles-sale

  datasource:
    url: jdbc:postgresql://localhost:5432/kalles
    username: kalles_admin
    password: kalles_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    detect-encoding: true
    locations: classpath:db/migration,classpath:db/seed

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  encryption:
    tenant-credentials-secret: ${TENANT_CREDENTIALS_SECRET}

app:
  security:
    cookies:
      secure: ${APP_SECURE_COOKIES:false}

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:}
    default-plan-code: monthly-default

mercadopago:
  app-id: ${MERCADOPAGO_APP_ID:448684586415948}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  client-id: ${MERCADOPAGO_CLIENT_ID:}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
  redirect-uri: ${MERCADOPAGO_REDIRECT_URI:https://localhost:3000/admin/pagamentos/mp-callback}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

stone:
  webhook-secret: ${STONE_WEBHOOK_SECRET:}

payments:
  simulation:
    # Quando false (default), cartão/PIX pelo fluxo direto são rejeitados e o
    # pagamento deve acontecer via terminal integrado (confirmado por webhook).
    enabled: ${PAYMENTS_SIMULATION_ENABLED:false}
