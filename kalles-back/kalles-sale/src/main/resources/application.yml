spring:
  application:
    name: kalles-sale

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kalles}
    username: ${DB_USERNAME:kalles_admin}
    password: ${DB_PASSWORD:kalles_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    detect-encoding: true
    locations: classpath:db/migration,classpath:db/seed

  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:20s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

api:
  security:
    token:
      secret: ${API_TOKEN_SECRET}

security:
  encryption:
    tenant-credentials-secret: ${TENANT_CREDENTIALS_SECRET}

app:
  security:
    cookies:
      secure: ${APP_SECURE_COOKIES:false}

payment:
  oauth:
    state-secret: ${PAYMENT_OAUTH_STATE_SECRET}

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:}
    default-plan-code: monthly-default

mercadopago:
  app-id: ${MERCADOPAGO_APP_ID:448684586415948}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  client-id: ${MERCADOPAGO_CLIENT_ID:}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
  redirect-uri: ${MERCADOPAGO_REDIRECT_URI:https://localhost:3000/admin/pagamentos/mp-callback}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

payments:
  simulation:
    # Quando false (default), cartão/PIX pelo fluxo direto são rejeitados e o
    # pagamento deve acontecer via terminal integrado (confirmado por webhook).
    enabled: ${PAYMENTS_SIMULATION_ENABLED:false}
